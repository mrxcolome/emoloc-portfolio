# Desplegament automàtic a Cloudflare Pages: cada push a main publica la web a xavicolome.com.
# Secrets del repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (token d'API amb el permís "Cloudflare Pages: Edit")
#   CLOUDFLARE_ACCOUNT_ID (l'identificador del compte, a la pàgina d'inici del tauler de Cloudflare)
# La clau del correu del formulari (RESEND_API_KEY) NO va aquí: es posa al projecte de Pages, a Settings → Variables and Secrets.
name: desplegar a cloudflare pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permet llançar-lo a mà des de la pestanya Actions

concurrency:
  group: desplegament
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: baixar el codi
        uses: actions/checkout@v4

      - name: preparar la carpeta dist/ (només els fitxers que es publiquen)
        run: bash scripts/dist.sh

      - name: publicar a Cloudflare Pages (projecte xavicolome)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=xavicolome --branch=main --commit-dirty=true
