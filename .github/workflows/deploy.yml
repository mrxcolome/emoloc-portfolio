# Desplegament automàtic a Webempresa: cada push a main sincronitza la web per FTPS.
# Credencials als Secrets del repo (Settings -> Secrets and variables -> Actions):
#   FTP_SERVIDOR, FTP_USUARI, FTP_CONTRASENYA, FTP_CARPETA (p. ex. /www/)
name: desplegar a webempresa

on:
  push:
    branches: [main]
  workflow_dispatch: # permet llançar-lo a mà des de la pestanya Actions

concurrency:
  group: desplegament
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: baixar el codi
        uses: actions/checkout@v4

      - name: normalitzar la carpeta de destí (ha d'acabar amb /)
        id: carpeta
        env:
          FTP_CARPETA: ${{ secrets.FTP_CARPETA }}
        run: |
          dir="${FTP_CARPETA%/}/"
          # PROTECCIÓ MENTRE ÉS DE PROVA: només es publica dins d'una carpeta /test/.
          # Quan passem a l'arrel, treu aquestes tres línies.
          if [[ "$dir" != */test/ ]]; then echo "::error::La carpeta de destí no acaba en /test/ (té ${#dir} caràcters). Aturo el desplegament per no tocar la web actual."; exit 1; fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: diagnòstic de connexió (no mostra cap valor secret)
        env:
          FTP_SERVIDOR: ${{ secrets.FTP_SERVIDOR }}
          FTP_USUARI: ${{ secrets.FTP_USUARI }}
          FTP_CONTRASENYA: ${{ secrets.FTP_CONTRASENYA }}
          FTP_CARPETA: ${{ secrets.FTP_CARPETA }}
        run: |
          echo "servidor: ${#FTP_SERVIDOR} caràcters, resol a $(getent hosts "$FTP_SERVIDOR" | awk '{print $1}' | head -1)"
          echo "usuari: ${#FTP_USUARI} caràcters, porta arrova: $([[ "$FTP_USUARI" == *@* ]] && echo sí || echo no), espais o salts de línia: $([[ "$FTP_USUARI" =~ [[:space:]] ]] && echo SÍ || echo no)"
          echo "contrasenya: ${#FTP_CONTRASENYA} caràcters, espais o salts de línia: $([[ "$FTP_CONTRASENYA" =~ [[:space:]] ]] && echo SÍ || echo no)"
          echo "carpeta: ${#FTP_CARPETA} caràcters"
          echo "--- qui respon al port 21: banner i certificat TLS ---"
          for h in "$FTP_SERVIDOR" emoloc.com escoladansa.com; do
            echo "· $h -> $(getent hosts "$h" | awk '{print $1}' | head -1)"
            timeout 20 bash -c "echo | openssl s_client -starttls ftp -connect $h:21 -servername $h 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | tr '\n' ' ' | cut -c1-300" || echo "  (sense resposta TLS)"
            echo
            timeout 15 curl -sS --max-time 12 -v "ftp://$h/" --user "x:y" 2>&1 | grep -E "^< (220|530|421)" | head -3
          done
          echo "--- prova d'entrada amb FTPS explícit (port 21) ---"
          if curl -sS --ssl-reqd --insecure --max-time 30 --list-only "ftp://$FTP_SERVIDOR/" --user "$FTP_USUARI:$FTP_CONTRASENYA" > /tmp/llista.txt; then echo "ENTRADA CORRECTA (FTPS), $(wc -l < /tmp/llista.txt) entrades a l'arrel del compte"; else echo "ENTRADA REBUTJADA (FTPS)"; fi

      - name: sincronitzar per FTPS (només fitxers canviats)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARI }}
          password: ${{ secrets.FTP_CONTRASENYA }}
          protocol: ftps
          server-dir: ${{ steps.carpeta.outputs.dir }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            content/**
            design/**
            blog/build.py
            .gitignore
            README.md
